services:
  twitch-drops-miner:
    container_name: twitch-drops-miner
    image: ghcr.io/eb-plum/twitch-drops-miner:latest
    init: true
    stop_grace_period: 30s
    shm_size: 256m
    ports:
      - "0.0.0.0:8080:8080"
    volumes:
      # Mount data directory for persistent storage
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      # Match the timezone of your home internet connection for Twitch browser login.
      - TZ=Asia/Seoul
      # Optional: exact public URL when using a reverse proxy (root URL, no subpath).
      # HTTPS here enables Secure cookies even when the proxy uses HTTP to this container.
      # Does not trust forwarded client IPs; leave unset for direct HTTP access.
      # - PUBLIC_BASE_URL=https://drops.example.com
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower:latest
    container_name: twitch-drops-miner-watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: twitch-drops-miner --interval 3600 --cleanup
    restart: unless-stopped
